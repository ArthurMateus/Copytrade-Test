# Telegram UI. Token, owner chat id and PIN come from the environment ONLY:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, COPYBOT_PIN
api_base = "https://api.telegram.org"
edit_min_interval_s = 5.0     # at most one edit per message per this many seconds
min_send_interval_s = 1.1     # global spacing of all messages/edits to the chat
poll_timeout_s = 25           # getUpdates long-poll
