[project]
name = "copybot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ArthurMateus", email = "your-email@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "websockets>=17.2",
    # signs the live wallet's orders (copybot/live.py only; loaded only when live trading is on)
    "hyperliquid-python-sdk==0.24.0",
]

[project.scripts]
copybot = "copybot:main"
copybot-dashboard = "copybot.dashboard:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
