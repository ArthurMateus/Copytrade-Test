# Invo (Involio) calls, copied on paper by the "invo calls" side wallet (shown in /hyperwallet).
# Needs INVO_TOKEN_FILE in the environment: a file holding the refresh token of the bot's OWN Invo account
# (never your main one: every refresh replaces the token, so two programs on one login log each other out).
# Without it this whole section stays off. Allowed ranges in brackets.
enabled = true
api_base = "https://api.invoapp.com/v1_0"
poll_s = 5.0              # seconds between rounds; each round asks every followed trader once      [1, 600]
request_gap_s = 0.5       # spacing of requests to Invo (7 traders = ~3.5 s per round)             [0.2, 5]
max_call_age_s = 180.0    # calls older than this when first seen are not copied (late entry)      [10, 1800]
size_mult = 1.0           # our exposure = their size x leverage x this, of our 300$ (at least 10$) [0.1, 10]
max_risk_pct = 2.0        # one copy never risks more than this % of our 300$ at our 3% stop (2% = 200$ max) [0.1, 20]
limits_pct = 5.0          # the wallet's risk limits = a side wallet at this risk level              [0.5, 20]
max_traders = 7           #                                                                         [0, 20]
risk_wallets_pct = [1.0, 2.0, 5.0, 10.0, 20.0]
# Portfolio filter: a trader's calls are only copied from its portfolios with at least this win rate, this % return
# (Invo's P&L of the portfolio) and this many closed calls. /invoblock <user> <portfolio> blocks one by hand.
min_portfolio_win_rate = 0.80   # 0.80 = 80%                                                          [0, 1]
min_portfolio_pnl_pct = 100.0   # the portfolio's total return on Invo, % (100 = doubled)                          [-100, 100000]
min_portfolio_calls = 20        # fewer closed calls: too new to judge, skipped                         [0, 10000]
# The daily Invo search: Invo's Discover rankings -> each trader's closed calls -> the SAME scoring as Hyperliquid
# wallets (win rate, profit factor, no single trade > 30% of profit, drawdowns, score >= 70 ...), shown in the
# daily picks (13h, /picks). It only reports: you follow with /invofollow.
search = true
review_hours = 24.0       # one search per this many hours                                          [1, 168]
discover_pages = 20       # pages of 20 read from each Discover ranking                             [0, 20]
max_candidates = 1000     # traders scored per search (followed ones are always re-checked)        [0, 1000]
history_days = 180        # closed calls this old count                                             [30, 180]
max_calls = 600           # closed calls read per trader at most                                    [50, 5000]
min_hl_share = 0.5        # at least this share of its calls on coins Hyperliquid lists             [0, 1]
min_hold_min = 15.0       # median call at least this long (shorter cannot be copied)               [0, 1440]
max_idle_days = 14.0      # its newest call at most this old                                        [1, 90]
drop_after_fails = 2      # a followed trader failing the rules this many searches in a row leaves  [1, 10]   # fixed-risk Invo wallets next to the trader-size one (/invowallets)
