# Leader selection and hysteresis.
rescore_minutes = 60.0        # one selection cycle                          [0.05, 1440]
min_scored_to_start = 12      # start following once this many candidates are fully scored
join_rank = 7                 # join when rank <= this (the top 7) ...      [1, 8]
drop_rank = 15                # drop when rank > this ...                   [8, 15]
confirm_cycles = 2            # ... for this many consecutive cycles         [2, 10]
min_follow_hours = 24.0       # never drop a good leader followed for less than this (bad ones leave at once)
change_cooldown_hours = 24.0  # new leaders join at most once per this many hours  [0, 168]
min_win_rate = 0.60           # a wallet needs at least this win rate to be eligible  [0, 1]
min_score = 70.0              # ... at least this score out of 100  [1, 100]
min_profit_factor = 2.0       # ... and a profit factor (money won / money lost) of at least this  [1, 10]
max_drawdown = 0.30           # ... and a biggest fall from a peak of at most this (0.30 = 30%)  [0.05, 1]
max_open_loss = 0.15          # ... and open (not yet closed) losses of at most this share of its account. A losing
                              # position it keeps open also counts as a lost trade in its win rate.  [0.01, 1]
# "Is it losing RIGHT NOW?" gates: a long good history does not excuse a bad week (all must pass).
max_loss_7d = 0.03            # lost at most this share of its account over 7 days (current open losses count)  [0, 0.10]
max_loss_24h = 0.015          # ... and at most this over the last 24 hours  [0, 0.05]
max_loss_streak = 4           # ... at most this many losing round trips in a row, latest first  [1, 8]
min_recent_win_rate = 0.45    # ... and it won at least this share of its last 15 round trips  [0.30, 1]
max_dd_7d = 0.10              # ... and its hourly equity never fell more than this within 7 days  [0.01, 0.20]
# Changing these rescores the saved wallets automatically at the next start.
swaps_per_cycle = 1           #                                              [1, 1]
history_days = 180            # fills history used for scoring               [60, 180]
max_candidates = 2000         # prescreened wallets that get fill-screened per review (about 7 per minute: the
                              # first full pass takes 5-6 h in the background; results are kept 7 days)  [10, 5000]
pool_size = 100               # a review stops screening once this many wallets are fully scored (the top 100)  [7, 400]
dropped_cooldown_days = 7.0   # a dropped or paused leader cannot rejoin for this long
# Only these coins are scored (a wallet's trades in other coins are ignored) and copied (the risk gate refuses
# entries on anything else). Exits on a coin removed from this list keep working.
main_coins = ["BTC", "ETH", "SOL", "XRP", "BNB", "DOGE", "ADA", "AVAX", "LINK", "LTC"]
# Diversified wallets unlock every Hyperliquid perp (memecoins like PUMP, kPEPE, WIF...): a wallet that is net
# profitable in at least alt_min_coins coins, with no single coin above alt_max_coin_share of its profit, is scored
# on all its perp trades and copied in all of them. Others stay on main_coins. Set alt_min_coins = 1000 to disable.
alt_min_coins = 3             # [2, 1000]
alt_max_coin_share = 0.5      # [0.1, 1]
