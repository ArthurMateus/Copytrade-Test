# Invo (Involio) calls, copied on paper by the "invo calls" side wallet (shown in /hyperwallet).
# Needs INVO_TOKEN_FILE in the environment: a file holding the refresh token of the bot's OWN Invo account
# (never your main one: every refresh replaces the token, so two programs on one login log each other out).
# Without it this whole section stays off. Allowed ranges in brackets.
enabled = true
api_base = "https://api.invoapp.com/v1_0"
poll_s = 0.0              # pause between rounds; each round asks every watched trader once        [0, 600]
request_gap_s = 0.5       # spacing of requests to Invo (7 traders = ~4 s per round; 2 req/s). 0.25 brought 429  [0.2, 5]
                          # storms (4,902 refused reads 10-11/12, copies up to 170 s late)
max_call_age_s = 180.0    # calls older than this when first seen are not copied (late entry)      [10, 1800]
size_mult = 1.0           # our exposure = their size x leverage x this, of our 300$ (at least 10$) [0.1, 10]
live_size_mult = 10.0     # the same for real-money portfolios (their traders bet ~1% of the account) [0.1, 50]
max_risk_pct = 1.0        # one copy never risks more than this % of our 300$ at our 3% stop (1% = 100$ max) [0.1, 20]
                          # (2 until 2026-10-12: the 5 worst copies, 76-377$, lost more than the 5 best made)
limits_pct = 5.0          # the wallet's risk limits = a side wallet at this risk level              [0.5, 20]
max_traders = 10          #                                                                         [0, 20]
risk_wallets_pct = [1.0, 2.0, 5.0, 10.0, 20.0]
# Trailing stop of every Invo wallet (instead of the one in risk.toml). Off: on 180 days of real prices it cut the big
# winners this book needs. 5 and 5 would start it at +5% and trail 5% behind.
trail_after_pct = 0.0     # once a copy is this % in profit the stop follows the price (0 = off)   [0, 50]
trail_pct = 3.0           # ... this % behind the best price, never below break-even                [0.2, 20]
pause_dd_pct = 4.0        # drop a trader once its copies lost this % of the wallet from their best [0.5, 50]
                          # (4% = 12$: four 3% stops of the biggest copy, or ONE copy closed by the trader 12%
                          # down; 5 losing copies in a row also drop it)
# Stops compared (owner request 2026-10-12): every size above (trader size and each risk level) runs once per stop,
# same calls and same copy size, only the exit differs; /invowallets shows the 3 best and 3 worst combinations.
# Must include our usual stop (risk.toml stop_pct, 3). 0 = the trader's exit: the copy closes when the trader closes,
# with only a guard just before where a copy that big would be liquidated (30% for small copies, ~11% at 20% risk).
stops_pct = [3.0, 8.0, 0.0]
# The stop of the MAIN Invo wallets (the trader-size one with the Discord cards, and the plain-named risk wallets); the
# others in stops_pct run next to them for comparison, on exactly the calls the main ones copied. 0 = no stop of ours:
# a copy stays open until the trader closes it (only the guard above). Changing it: /flatten, then /reset <PIN>.
main_stop_pct = 0.0
aliases = {}              # Invo ticker -> Hyperliquid coin when the names differ, e.g. { MATIC = "POL" }
# Portfolio filter: the daily search scores EACH portfolio with our rules and only passing ones are copied. A paper
# portfolio must also have at least this win rate, this % return (Invo's P&L of the portfolio) and this many closed
# calls; a real-money ("live") one that passes our rules does not. Not scored yet: these floors on its own numbers.
# /invoblock <user> <portfolio> blocks one by hand.
min_portfolio_win_rate = 0.80   # 0.80 = 80%                                                          [0, 1]
min_portfolio_pnl_pct = 100.0   # the portfolio's total return on Invo, % (100 = doubled)                          [-100, 100000]
min_portfolio_calls = 20        # fewer closed calls: too new to judge, skipped                         [0, 10000]
# The daily Invo search: Invo's Discover rankings -> each trader's closed calls -> the SAME scoring as Hyperliquid
# wallets (win rate, profit factor, no single trade > 30% of profit, drawdowns, score >= 70 ...), shown in the
# daily picks (13h, /picks). It only reports: you follow with /invofollow.
search = true
review_hours = 24.0       # one search per this many hours                                          [1, 168]
discover_pages = 20       # pages of 20 read from each Discover ranking                             [0, 20]
max_candidates = 1000     # traders scored per search (followed ones are always re-checked)        [0, 1000]
history_days = 180        # closed calls this old count                                             [30, 180]
max_calls = 600           # closed calls read per trader at most                                    [50, 5000]
min_hl_share = 0.5        # at least this share of its calls on coins Hyperliquid lists             [0, 1]
min_hold_min = 15.0       # median call at least this long (shorter cannot be copied)               [0, 1440]
max_idle_days = 14.0      # its newest call at most this old                                        [1, 90]
drop_after_fails = 2      # none of a followed trader's portfolios copied this many daily searches in a row: Discord asks you to drop it (buttons); /invofollow picks are never asked  [1, 10]   # fixed-risk Invo wallets next to the trader-size one (/invowallets)
